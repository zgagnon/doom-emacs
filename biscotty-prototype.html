<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biscotty Color Prototyper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #controls {
            width: 300px;
            padding: 20px;
            background: #2a2a2a;
            color: #fff;
            overflow-y: auto;
        }

        #preview {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            transition: background-color 0.1s;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #aaa;
        }

        .color-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="color"] {
            width: 60px;
            height: 40px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            border-radius: 4px;
        }

        .style-toggles {
            display: flex;
            gap: 15px;
            margin-top: 8px;
        }

        .style-toggles label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            text-transform: none;
            letter-spacing: 0;
            color: #ccc;
            cursor: pointer;
        }

        input[type="checkbox"] {
            cursor: pointer;
        }

        #code-sample {
            font-size: 16px;
            line-height: 1.6;
            white-space: pre;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
        }

        .token-string { font-weight: bold; }
        .token-number { font-weight: bold; }
        .token-constant { font-weight: bold; }
        .token-comment { font-weight: bold; }
        .token-definition { font-weight: bold; }
        .token-keyword { }
        .token-variable { }
        .token-operator { }

        h1 {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        h2 {
            font-size: 14px;
            margin: 30px 0 15px 0;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #444;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }

        button:hover {
            background: #555;
        }

        #output {
            margin-top: 20px;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 11px;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h1>🍪 Biscotty Prototyper</h1>

        <h2>Base</h2>
        <div class="control-group">
            <label>Background</label>
            <div class="color-input-group">
                <input type="color" id="bg-color" value="#f5ede5">
                <input type="text" id="bg-hex" value="#f5ede5">
            </div>
        </div>

        <div class="control-group">
            <label>Foreground (text)</label>
            <div class="color-input-group">
                <input type="color" id="fg-color" value="#3a3a3a">
                <input type="text" id="fg-hex" value="#3a3a3a">
            </div>
        </div>

        <h2>Tonsky Five</h2>
        <div class="control-group">
            <label>Strings (green)</label>
            <div class="color-input-group">
                <input type="color" id="strings-color" value="#177058">
                <input type="text" id="strings-hex" value="#177058">
            </div>
            <div class="style-toggles">
                <label><input type="checkbox" id="strings-bold" checked> Bold</label>
                <label><input type="checkbox" id="strings-italic"> Italic</label>
            </div>
        </div>

        <div class="control-group">
            <label>Numbers (coral)</label>
            <div class="color-input-group">
                <input type="color" id="numbers-color" value="#d14830">
                <input type="text" id="numbers-hex" value="#d14830">
            </div>
            <div class="style-toggles">
                <label><input type="checkbox" id="numbers-bold" checked> Bold</label>
                <label><input type="checkbox" id="numbers-italic"> Italic</label>
            </div>
        </div>

        <div class="control-group">
            <label>Constants (purple)</label>
            <div class="color-input-group">
                <input type="color" id="constants-color" value="#7a4a94">
                <input type="text" id="constants-hex" value="#7a4a94">
            </div>
            <div class="style-toggles">
                <label><input type="checkbox" id="constants-bold" checked> Bold</label>
                <label><input type="checkbox" id="constants-italic"> Italic</label>
            </div>
        </div>

        <div class="control-group">
            <label>Comments (blue)</label>
            <div class="color-input-group">
                <input type="color" id="comments-color" value="#3d5f9a">
                <input type="text" id="comments-hex" value="#3d5f9a">
            </div>
            <div class="style-toggles">
                <label><input type="checkbox" id="comments-bold" checked> Bold</label>
                <label><input type="checkbox" id="comments-italic"> Italic</label>
            </div>
        </div>

        <div class="control-group">
            <label>Definitions (brown)</label>
            <div class="color-input-group">
                <input type="color" id="definitions-color" value="#8f5d35">
                <input type="text" id="definitions-hex" value="#8f5d35">
            </div>
            <div class="style-toggles">
                <label><input type="checkbox" id="definitions-bold" checked> Bold</label>
                <label><input type="checkbox" id="definitions-italic"> Italic</label>
            </div>
        </div>

        <button onclick="copyColors()">Copy Color Values</button>
        <div id="output"></div>
    </div>

    <div id="preview">
        <div id="code-sample"></div>
    </div>

    <script>
        // 256-color terminal palette quantization
        // RGB cube: 6x6x6 = 216 colors (indices 16-231)
        // Each component: 0, 95, 135, 175, 215, 255
        const terminalLevels = [0, 95, 135, 175, 215, 255];

        function quantizeToTerminal256(hex) {
            // Parse hex color
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);

            // Quantize each component to nearest terminal level
            const qr = terminalLevels.reduce((prev, curr) =>
                Math.abs(curr - r) < Math.abs(prev - r) ? curr : prev
            );
            const qg = terminalLevels.reduce((prev, curr) =>
                Math.abs(curr - g) < Math.abs(prev - g) ? curr : prev
            );
            const qb = terminalLevels.reduce((prev, curr) =>
                Math.abs(curr - b) < Math.abs(prev - b) ? curr : prev
            );

            // Convert back to hex
            return '#' +
                qr.toString(16).padStart(2, '0') +
                qg.toString(16).padStart(2, '0') +
                qb.toString(16).padStart(2, '0');
        }

        const codeSample = `<span class="token-comment">// Tonsky-compliant syntax highlighting demo</span>
<span class="token-keyword">import</span> { <span class="token-variable">readFile</span>, <span class="token-variable">writeFile</span> } <span class="token-keyword">from</span> <span class="token-string">"fs/promises"</span>;

<span class="token-keyword">const</span> <span class="token-constant">MAX_RETRIES</span> <span class="token-operator">=</span> <span class="token-number">3</span>;
<span class="token-keyword">const</span> <span class="token-constant">API_URL</span> <span class="token-operator">=</span> <span class="token-string">"https://api.example.com"</span>;

<span class="token-comment">// Function to fetch user data with retry logic</span>
<span class="token-keyword">async</span> <span class="token-keyword">function</span> <span class="token-definition">fetchUserData</span>(<span class="token-variable">userId</span><span class="token-operator">:</span> <span class="token-keyword">string</span>)<span class="token-operator">:</span> <span class="token-keyword">Promise</span><span class="token-operator">&lt;</span><span class="token-keyword">User</span><span class="token-operator">&gt;</span> {
  <span class="token-keyword">let</span> <span class="token-variable">attempts</span> <span class="token-operator">=</span> <span class="token-number">0</span>;

  <span class="token-keyword">while</span> (<span class="token-variable">attempts</span> <span class="token-operator">&lt;</span> <span class="token-constant">MAX_RETRIES</span>) {
    <span class="token-keyword">try</span> {
      <span class="token-keyword">const</span> <span class="token-variable">response</span> <span class="token-operator">=</span> <span class="token-keyword">await</span> <span class="token-variable">fetch</span>(<span class="token-string">\`\${API_URL}/users/\${userId}\`</span>);
      <span class="token-keyword">const</span> <span class="token-variable">data</span> <span class="token-operator">=</span> <span class="token-keyword">await</span> <span class="token-variable">response</span>.<span class="token-variable">json</span>();

      <span class="token-keyword">if</span> (<span class="token-variable">data</span>.<span class="token-variable">status</span> <span class="token-operator">===</span> <span class="token-string">"active"</span>) {
        <span class="token-keyword">return</span> <span class="token-variable">data</span>;
      }
    } <span class="token-keyword">catch</span> (<span class="token-variable">error</span>) {
      <span class="token-variable">attempts</span><span class="token-operator">++</span>;
      <span class="token-comment">// Log error and retry</span>
      <span class="token-variable">console</span>.<span class="token-variable">error</span>(<span class="token-string">"Fetch failed:"</span>, <span class="token-variable">error</span>);
    }
  }

  <span class="token-keyword">throw</span> <span class="token-keyword">new</span> <span class="token-variable">Error</span>(<span class="token-string">"Max retries exceeded"</span>);
}

<span class="token-comment">// Notice: keywords (if, const, async) are NOT highlighted</span>
<span class="token-comment">// Notice: variables (attempts, data) are NOT highlighted</span>
<span class="token-comment">// Only the Tonsky Five get colors!</span>`;

        const codePreview = document.getElementById('code-sample');
        const preview = document.getElementById('preview');

        codePreview.innerHTML = codeSample;

        function syncInputs(colorInput, hexInput) {
            colorInput.addEventListener('input', (e) => {
                const quantized = quantizeToTerminal256(e.target.value);
                hexInput.value = quantized;
                colorInput.value = quantized;
                updatePreview();
            });

            hexInput.addEventListener('input', (e) => {
                const hex = e.target.value;
                if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
                    const quantized = quantizeToTerminal256(hex);
                    colorInput.value = quantized;
                    hexInput.value = quantized;
                    updatePreview();
                }
            });
        }

        // Sync all color inputs with hex inputs
        syncInputs(document.getElementById('bg-color'), document.getElementById('bg-hex'));
        syncInputs(document.getElementById('fg-color'), document.getElementById('fg-hex'));
        syncInputs(document.getElementById('strings-color'), document.getElementById('strings-hex'));
        syncInputs(document.getElementById('numbers-color'), document.getElementById('numbers-hex'));
        syncInputs(document.getElementById('constants-color'), document.getElementById('constants-hex'));
        syncInputs(document.getElementById('comments-color'), document.getElementById('comments-hex'));
        syncInputs(document.getElementById('definitions-color'), document.getElementById('definitions-hex'));

        // Add event listeners for style toggles
        const styleIds = ['strings', 'numbers', 'constants', 'comments', 'definitions'];
        styleIds.forEach(id => {
            document.getElementById(`${id}-bold`).addEventListener('change', updatePreview);
            document.getElementById(`${id}-italic`).addEventListener('change', updatePreview);
        });

        function updatePreview() {
            const bg = document.getElementById('bg-hex').value;
            const fg = document.getElementById('fg-hex').value;
            const strings = document.getElementById('strings-hex').value;
            const numbers = document.getElementById('numbers-hex').value;
            const constants = document.getElementById('constants-hex').value;
            const comments = document.getElementById('comments-hex').value;
            const definitions = document.getElementById('definitions-hex').value;

            // Get style toggles
            const stringsBold = document.getElementById('strings-bold').checked;
            const stringsItalic = document.getElementById('strings-italic').checked;
            const numbersBold = document.getElementById('numbers-bold').checked;
            const numbersItalic = document.getElementById('numbers-italic').checked;
            const constantsBold = document.getElementById('constants-bold').checked;
            const constantsItalic = document.getElementById('constants-italic').checked;
            const commentsBold = document.getElementById('comments-bold').checked;
            const commentsItalic = document.getElementById('comments-italic').checked;
            const definitionsBold = document.getElementById('definitions-bold').checked;
            const definitionsItalic = document.getElementById('definitions-italic').checked;

            preview.style.backgroundColor = bg;
            preview.style.color = fg;

            const style = document.createElement('style');
            style.textContent = `
                .token-string {
                    color: ${strings};
                    font-weight: ${stringsBold ? 'bold' : 'normal'};
                    font-style: ${stringsItalic ? 'italic' : 'normal'};
                }
                .token-number {
                    color: ${numbers};
                    font-weight: ${numbersBold ? 'bold' : 'normal'};
                    font-style: ${numbersItalic ? 'italic' : 'normal'};
                }
                .token-constant {
                    color: ${constants};
                    font-weight: ${constantsBold ? 'bold' : 'normal'};
                    font-style: ${constantsItalic ? 'italic' : 'normal'};
                }
                .token-comment {
                    color: ${comments};
                    font-weight: ${commentsBold ? 'bold' : 'normal'};
                    font-style: ${commentsItalic ? 'italic' : 'normal'};
                }
                .token-definition {
                    color: ${definitions};
                    font-weight: ${definitionsBold ? 'bold' : 'normal'};
                    font-style: ${definitionsItalic ? 'italic' : 'normal'};
                }
                .token-keyword { color: ${fg}; }
                .token-variable { color: ${fg}; }
                .token-operator { color: ${fg}; }
            `;

            const oldStyle = document.querySelector('style[data-dynamic]');
            if (oldStyle) oldStyle.remove();
            style.setAttribute('data-dynamic', 'true');
            document.head.appendChild(style);
        }

        function copyColors() {
            const output = {
                background: document.getElementById('bg-hex').value,
                foreground: document.getElementById('fg-hex').value,
                strings: {
                    color: document.getElementById('strings-hex').value,
                    bold: document.getElementById('strings-bold').checked,
                    italic: document.getElementById('strings-italic').checked
                },
                numbers: {
                    color: document.getElementById('numbers-hex').value,
                    bold: document.getElementById('numbers-bold').checked,
                    italic: document.getElementById('numbers-italic').checked
                },
                constants: {
                    color: document.getElementById('constants-hex').value,
                    bold: document.getElementById('constants-bold').checked,
                    italic: document.getElementById('constants-italic').checked
                },
                comments: {
                    color: document.getElementById('comments-hex').value,
                    bold: document.getElementById('comments-bold').checked,
                    italic: document.getElementById('comments-italic').checked
                },
                definitions: {
                    color: document.getElementById('definitions-hex').value,
                    bold: document.getElementById('definitions-bold').checked,
                    italic: document.getElementById('definitions-italic').checked
                }
            };

            const text = JSON.stringify(output, null, 2);
            navigator.clipboard.writeText(text);

            const outputDiv = document.getElementById('output');
            outputDiv.textContent = 'Copied to clipboard!\n\n' + text;
        }

        // Initial render
        updatePreview();
    </script>
</body>
</html>
